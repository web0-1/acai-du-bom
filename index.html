<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Açaí Du Bom · Peça Online</title>
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ================================================================
           RESET + BASE (clean, roxo forte)
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0a0e;
            color: #f5ece6;
            line-height: 1.5;
            min-height: 100vh;
            background-image: radial-gradient(circle at 30% 20%, #1a1018 0%, #0f0a0e 90%);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1218; }
        ::-webkit-scrollbar-thumb { background: #b55a9a; border-radius: 10px; }

        /* ===== HEADER ===== */
        .header {
            background: rgba(15, 10, 14, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(181, 90, 154, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-left img {
            height: 80px;
            width: auto;
            border-radius: 12px;
            filter: drop-shadow(0 0 20px rgba(181, 90, 154, 0.2));
            transition: transform 0.3s;
        }
        .header-left img:hover { transform: scale(1.03); }

        .header-left .brand {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: #f5ece6;
            letter-spacing: -0.5px;
        }
        .header-left .brand span { color: #b55a9a; }

        .header-right .badge {
            background: rgba(181, 90, 154, 0.15);
            border: 1px solid rgba(181, 90, 154, 0.3);
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            color: #b55a9a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1280px;
            margin: 24px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 32px;
            align-items: start;
        }

        /* ===== CARDÁPIO ===== */
        .menu { display: flex; flex-direction: column; gap: 40px; }

        .menu-category {
            animation: fadeUp 0.5s ease both;
        }
        .menu-category:nth-child(2) { animation-delay: 0.1s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            border-bottom: 2px solid rgba(181, 90, 154, 0.15);
            padding-bottom: 10px;
        }
        .category-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: #f5ece6;
            letter-spacing: -0.2px;
        }
        .category-header i {
            font-size: 1.4rem;
            color: #b55a9a;
        }
        .category-badge {
            background: rgba(181, 90, 154, 0.1);
            color: #b55a9a;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: auto;
            border: 1px solid rgba(181, 90, 154, 0.15);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .menu-item {
            background: #1a1218;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(181, 90, 154, 0.06);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: default;
            display: flex;
            flex-direction: column;
        }

        .menu-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(181, 90, 154, 0.1);
            border-color: rgba(181, 90, 154, 0.2);
        }

        .menu-item .item-image {
            width: 100%;
            height: 160px;
            background: #1a1218;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 6px;
        }
        .menu-item .item-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .menu-item .item-image .placeholder-icon {
            font-size: 3rem;
            color: #b55a9a;
            opacity: 0.4;
        }

        .menu-item .item-body {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .menu-item .item-name {
            font-weight: 600;
            font-size: 1rem;
            color: #f5ece6;
            margin-bottom: 2px;
        }
        .menu-item .item-desc {
            font-size: 0.75rem;
            color: #b09a8e;
            margin-bottom: 8px;
            flex-grow: 1;
        }
        .menu-item .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(181, 90, 154, 0.08);
            padding-top: 10px;
            margin-top: 2px;
        }
        .menu-item .item-price {
            font-weight: 700;
            font-size: 1.1rem;
            color: #b55a9a;
        }
        .menu-item .btn-add {
            background: linear-gradient(135deg, #7a1a6a, #b55a9a);
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 12px rgba(122, 26, 106, 0.3);
        }
        .menu-item .btn-add:hover {
            transform: scale(1.04);
            background: linear-gradient(135deg, #8a2a7a, #c56aaa);
            box-shadow: 0 6px 20px rgba(122, 26, 106, 0.4);
        }
        .menu-item .btn-add:active { transform: scale(0.95); }

        /* ===== CARRINHO SIDEBAR ===== */
        .cart-sidebar {
            background: rgba(20, 14, 18, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 24px 20px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(181, 90, 154, 0.08);
            position: sticky;
            top: 120px;
            max-height: calc(100vh - 160px);
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar .cart-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f5ece6;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(181, 90, 154, 0.1);
            margin-bottom: 14px;
        }
        .cart-sidebar .cart-title i { color: #b55a9a; }
        .cart-sidebar .cart-title span {
            background: rgba(181, 90, 154, 0.1);
            padding: 0 10px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #b55a9a;
            margin-left: auto;
        }

        .cart-items-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 10px;
        }
        .cart-items-scroll::-webkit-scrollbar { width: 4px; }
        .cart-items-scroll::-webkit-scrollbar-thumb { background: #4a2a3e; border-radius: 10px; }

        .cart-empty {
            color: #7a6a64;
            text-align: center;
            padding: 24px 0;
            font-size: 0.9rem;
        }
        .cart-empty i {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 10px;
            opacity: 0.3;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(181, 90, 154, 0.05);
            animation: slideIn 0.2s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .cart-item:last-child { border-bottom: none; }
        .cart-item .item-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .cart-item .item-name {
            font-weight: 500;
            font-size: 0.8rem;
            color: #f5ece6;
        }
        .cart-item .item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }
        .cart-item .item-qty button {
            background: rgba(181, 90, 154, 0.1);
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            color: #f5ece6;
            transition: all 0.15s;
        }
        .cart-item .item-qty button:hover {
            background: rgba(181, 90, 154, 0.2);
            color: #b55a9a;
        }
        .cart-item .item-qty span {
            min-width: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: #f5ece6;
        }
        .cart-item .item-total {
            font-weight: 600;
            color: #b55a9a;
            font-size: 0.9rem;
        }

        /* ===== ENTREGA + PAGAMENTO ===== */
        .delivery-area {
            margin: 8px 0 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(181, 90, 154, 0.08);
        }
        .delivery-area label {
            font-size: 0.8rem;
            color: #b09a8e;
            display: block;
            margin-bottom: 4px;
        }
        .delivery-area .input-group {
            display: flex;
            gap: 6px;
        }
        .delivery-area input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(181, 90, 154, 0.1);
            border-radius: 30px;
            padding: 6px 12px;
            color: #f5ece6;
            font-size: 0.8rem;
            outline: none;
            transition: border 0.2s;
        }
        .delivery-area input:focus {
            border-color: #b55a9a;
        }
        .delivery-area .btn-calc-frete {
            background: rgba(181, 90, 154, 0.1);
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            color: #f5ece6;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
        }
        .delivery-area .btn-calc-frete:hover {
            background: rgba(181, 90, 154, 0.2);
            color: #b55a9a;
        }
        .delivery-area .frete-result {
            margin-top: 4px;
            font-size: 0.8rem;
            color: #b09a8e;
        }
        .delivery-area .frete-result strong { color: #b55a9a; }

        .payment-area {
            margin: 6px 0 10px;
        }
        .payment-area label {
            font-size: 0.8rem;
            color: #b09a8e;
            display: block;
            margin-bottom: 4px;
        }
        .payment-area .radio-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .payment-area .radio-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #f5ece6;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .payment-area .radio-group input[type="radio"] {
            accent-color: #b55a9a;
            width: 14px;
            height: 14px;
        }
        .payment-area .troco-area {
            margin-top: 6px;
            display: none;
        }
        .payment-area .troco-area.show { display: block; }
        .payment-area .troco-area input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(181, 90, 154, 0.1);
            border-radius: 30px;
            padding: 6px 12px;
            color: #f5ece6;
            font-size: 0.8rem;
            outline: none;
        }
        .payment-area .troco-area input:focus { border-color: #b55a9a; }
        .payment-area .troco-result {
            margin-top: 4px;
            font-size: 0.8rem;
            color: #b09a8e;
        }
        .payment-area .troco-result strong { color: #b55a9a; }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 14px 0 8px;
            border-top: 1px solid rgba(181, 90, 154, 0.15);
            margin-top: 4px;
            color: #f5ece6;
        }

        .btn-checkout {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #25D366, #1da851);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.15);
            text-align: center;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-checkout:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 28px rgba(37, 211, 102, 0.25);
        }
        .btn-checkout:active { transform: scale(0.97); }

        .btn-clear {
            background: transparent;
            border: none;
            color: #7a6a64;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 10px 0 2px;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
            width: 100%;
        }
        .btn-clear:hover { color: #b55a9a; }

        /* ===== BOTÃO FLUTUANTE (mobile) ===== */
        .float-cart-btn {
            display: none;
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: #1a1218;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #f5ece6;
            border: 1px solid rgba(181, 90, 154, 0.2);
            border-radius: 50px;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            z-index: 900;
            gap: 6px;
            align-items: center;
            cursor: pointer;
        }
        .float-cart-btn i { color: #b55a9a; }
        .float-cart-btn .badge {
            background: #b55a9a;
            color: #0f0a0e;
            border-radius: 30px;
            padding: 0 8px;
            font-size: 0.65rem;
            font-weight: 700;
        }

        /* ===== MODAL DO CARRINHO (mobile) ===== */
        .cart-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            animation: fadeInModal 0.3s ease;
        }
        .cart-modal-overlay.active { display: flex; }
        .cart-modal-box {
            background: #1a1218;
            border: 1px solid rgba(181, 90, 154, 0.12);
            border-radius: 28px;
            padding: 24px 20px;
            max-width: 480px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
        }
        .cart-modal-box .close-modal {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            color: #7a6a64;
            font-size: 1.6rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .cart-modal-box .close-modal:hover { color: #b55a9a; }
        .cart-modal-box .cart-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f5ece6;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(181,90,154,0.1);
            margin-bottom: 14px;
        }
        .cart-modal-box .cart-title i { color: #b55a9a; }
        .cart-modal-box .cart-title span {
            background: rgba(181,90,154,0.1);
            padding: 0 10px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #b55a9a;
            margin-left: auto;
        }
        .cart-modal-box .cart-items-scroll {
            max-height: 40vh;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .cart-modal-box .cart-items-scroll::-webkit-scrollbar { width: 4px; }
        .cart-modal-box .cart-items-scroll::-webkit-scrollbar-thumb { background: #4a2a3e; border-radius: 10px; }

        /* ===== MODAL DE SABORES ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            animation: fadeInModal 0.3s ease;
        }
        .modal-overlay.active { display: flex; }

        @keyframes fadeInModal {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box {
            background: #1a1218;
            border: 1px solid rgba(181, 90, 154, 0.12);
            border-radius: 28px;
            padding: 28px 24px;
            max-width: 600px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .modal-box h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: #f5ece6;
            margin-bottom: 4px;
            text-align: center;
        }
        .modal-box .sub {
            color: #b09a8e;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 14px;
        }
        .modal-box .selected-size {
            background: rgba(181, 90, 154, 0.1);
            padding: 2px 16px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 600;
            color: #b55a9a;
            font-size: 0.85rem;
        }

        .modal-section {
            margin: 14px 0 10px;
        }
        .modal-section h4 {
            color: #b55a9a;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .modal-section .counter {
            font-size: 0.75rem;
            color: #b09a8e;
        }
        .modal-section .counter strong { color: #f5ece6; }

        .flavor-grid, .calda-grid, .condimento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .flavor-item, .calda-item, .condimento-item {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 8px 4px;
            color: #f5ece6;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-align: center;
            position: relative;
        }
        .flavor-item:hover, .calda-item:hover, .condimento-item:hover {
            background: rgba(181, 90, 154, 0.05);
            border-color: rgba(181, 90, 154, 0.2);
        }
        .flavor-item .emoji, .calda-item .emoji, .condimento-item .emoji {
            font-size: 1.2rem;
        }
        .flavor-item.selected, .calda-item.selected, .condimento-item.selected {
            border-color: #b55a9a;
            background: rgba(181, 90, 154, 0.08);
            box-shadow: 0 0 20px rgba(181, 90, 154, 0.05);
        }
        .flavor-item .check-mark, .calda-item .check-mark, .condimento-item .check-mark {
            display: none;
            font-size: 0.65rem;
            color: #b55a9a;
        }
        .flavor-item.selected .check-mark, .calda-item.selected .check-mark, .condimento-item.selected .check-mark {
            display: inline-block;
        }

        .flavor-qty-control {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
        }
        .flavor-qty-control button {
            background: rgba(181, 90, 154, 0.1);
            border: none;
            border-radius: 30px;
            width: 20px;
            height: 20px;
            color: #f5ece6;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        .flavor-qty-control button:hover {
            background: rgba(181, 90, 154, 0.2);
            color: #b55a9a;
        }
        .flavor-qty-control span {
            min-width: 18px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .btn-confirm-flavor {
            background: linear-gradient(135deg, #7a1a6a, #b55a9a);

            border: none;
            border-radius: 40px;
            padding: 10px 28px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;

            flex: 1;
            min-width: 100px;

            transform: scale(1.02);

        }
        .btn-confirm-flavor:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .modal-close {
            background: transparent;
            border: none;
            color: #7a6a64;
            font-size: 0.8rem;
            cursor: pointer;
            transition: color 0.2s;
            padding: 10px 14px;
        }
        .modal-close:hover { color: #b55a9a; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1218;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #f5ece6;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.85rem;

            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 999999;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast i { color: #b55a9a; }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr 320px; gap: 24px; }

        }

        }

        @media (max-width: 600px) {

                flavorCounts: {},
                selectedCaldaId: null,
                selectedCondimentos: [],

            const isCopo = (item.category === 'copo');
            let html = '';

                const count = modalState.flavorCounts[flavor.id] || 0;

                // Copo
                document.querySelectorAll('.flavor-qty-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.flavorId;
                        const action = btn.dataset.action;
                        const currentTotal = Object.values(modalState.flavorCounts).reduce((a, b) => a + b, 0);
                        if (action === 'incr') {
                            if (currentTotal >= 2) {
                                showToast('Máximo de 2 sabores por copo');
                                return;
                            }
                            modalState.flavorCounts[id] = (modalState.flavorCounts[id] || 0) + 1;
                        } else {
                            if (modalState.flavorCounts[id] > 0) {
                                modalState.flavorCounts[id] -= 1;
                                if (modalState.flavorCounts[id] === 0) delete modalState.flavorCounts[id];
                            }
                        }
                        updateModalUI();
                    });
                });
                document.querySelectorAll('#modalFlavorGrid .flavor-item').forEach(el => {
                    el.addEventListener('click', (e) => {
                        if (e.target.closest('.flavor-qty-btn')) return;
                        const id = el.dataset.flavorId;
                        const currentTotal = Object.values(modalState.flavorCounts).reduce((a, b) => a + b, 0);
                        if (currentTotal >= 2) {
                            showToast('Máximo de 2 sabores por copo');
                            return;
                        }
                        modalState.flavorCounts[id] = (modalState.flavorCounts[id] || 0) + 1;
                        updateModalUI();
                    });
                });

                // Caldas
                document.querySelectorAll('#modalCaldaGrid .calda-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const id = el.dataset.caldaId;
                        modalState.selectedCaldaId = (modalState.selectedCaldaId === id) ? null : id;
                        updateModalUI();
                    });
                });

                // Condimentos
                document.querySelectorAll('#modalCondimentoGrid .condimento-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const id = el.dataset.condimentoId;
                        const idx = modalState.selectedCondimentos.indexOf(id);
                        if (idx > -1) {
                            modalState.selectedCondimentos.splice(idx, 1);
                        } else {
                            modalState.selectedCondimentos.push(id);
                        }
                        updateModalUI();
                    });
                });
            }

            document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                confirmModal(item);
            });

            updateModalUI();
        }

        function closeModal() {
            modal.classList.remove('active');
            pendingItem = null;
        }

        function updateModalUI() {
            const isCopo = (pendingItem && pendingItem.category === 'copo');

            document.querySelectorAll('#modalFlavorGrid .flavor-item').forEach(el => {
                const id = el.dataset.flavorId;
                if (isCopo) {
                    const count = modalState.flavorCounts[id] || 0;
                    el.querySelector('.flavor-qty').textContent = count;
                    el.classList.toggle('selected', count > 0);
                } else {
                    el.classList.toggle('selected', modalState.selectedFlavorId === id);
                }
            });

            if (isCopo) {
                document.querySelectorAll('#modalCaldaGrid .calda-item').forEach(el => {
                    const id = el.dataset.caldaId;
                    el.classList.toggle('selected', modalState.selectedCaldaId === id);
                });
                document.querySelectorAll('#modalCondimentoGrid .condimento-item').forEach(el => {
                    const id = el.dataset.condimentoId;
                    el.classList.toggle('selected', modalState.selectedCondimentos.includes(id));
                });
            }

            const confirmBtn = document.getElementById('modalConfirmBtn');
            if (isCopo) {
                const totalSabores = Object.values(modalState.flavorCounts).reduce((a, b) => a + b, 0);
                confirmBtn.disabled = !(totalSabores > 0 && modalState.selectedCaldaId !== null);
            } else {
                confirmBtn.disabled = modalState.selectedFlavorId === null;
            }
        }

        function confirmModal(item) {
            const isCopo = (item.category === 'copo');

            let flavorText = '', caldaText = '', condText = '';

            if (isCopo) {
                const parts = [];
                Object.keys(modalState.flavorCounts).forEach(id => {
                    const count = modalState.flavorCounts[id];
                    if (count > 0) {
                        const flavor = saboresCopo.find(f => f.id === id);
                        if (flavor) parts.push(`${flavor.label} x${count}`);
                    }
                });
                flavorText = parts.join(' + ') || 'Nenhum';
                const calda = caldas.find(c => c.id === modalState.selectedCaldaId);
                caldaText = calda ? calda.label : 'Nenhuma';
                const conds = modalState.selectedCondimentos.map(id => condimentos.find(c => c.id === id)).filter(Boolean);
                condText = conds.map(c => c.label).join(' + ');
                if (!flavorText || !caldaText) {
                    alert('Selecione pelo menos 1 sabor e 1 calda.');
                    return;
                }
            } else {
                const flavor = saboresGarrafa.find(f => f.id === modalState.selectedFlavorId);
                if (!flavor) {
                    alert('Selecione um sabor.');
                    return;
                }
                flavorText = flavor.label;
                caldaText = 'Nenhuma';
                condText = 'Nenhum';
            }

            let itemName = `${item.name} - `;
            if (isCopo) {
                itemName += `Sabores: ${flavorText} | Calda: ${caldaText}`;
                if (condText && condText !== 'Nenhum') {
                    itemName += ` | Cond.: ${condText}`;
                }
            } else {
                itemName += `Sabor: ${flavorText}`;
            }

            const finalPrice = item.price;

            const idParts = [item.id];
            if (isCopo) {
                const flavorIds = Object.keys(modalState.flavorCounts).filter(k => modalState.flavorCounts[k] > 0).sort();
                flavorIds.forEach(fid => {
                    for (let i = 0; i < modalState.flavorCounts[fid]; i++) idParts.push(fid);
                });
                idParts.push('calda-' + (modalState.selectedCaldaId || 'none'));
                idParts.push('cond-' + modalState.selectedCondimentos.sort().join('-'));
            } else {
                idParts.push(modalState.selectedFlavorId || 'none');
            }
            const itemId = idParts.join('-');

            addToCart({ id: itemId, name: itemName, price: finalPrice });
            showToast(`🍧 ${itemName} adicionado!`);
            closeModal();
        }

        // ================================================================
        // 10. CARRINHO
        // ================================================================
        function renderCart() {
            const keys = Object.keys(cart);
            const totalItems = keys.reduce((acc, id) => acc + cart[id].quantity, 0);
            cartCount.textContent = totalItems;
            floatBadge.textContent = totalItems;

            if (window.innerWidth <= 850) {
                floatCartBtn.style.display = totalItems > 0 ? 'flex' : 'none';
            } else {
                floatCartBtn.style.display = 'none';
            }

            if (keys.length === 0) {
                cartItemsContainer.innerHTML = `<div class="cart-empty"><i class="fas fa-ice-cream"></i>Nenhum item adicionado</div>`;
                updateTotal(0);
                if (cartModal.classList.contains('active')) syncModalContent();
                return;
            }

            let html = '';
            let subtotal = 0;
            keys.forEach(id => {
                const item = cart[id];
                const st = item.price * item.quantity;
                subtotal += st;
                html += `
                    <div class="cart-item">
                        <div class="item-info">
                            <span class="item-name">${item.name}</span>
                            <div class="item-qty">
                                <button data-id="${id}" data-action="decr">−</button>
                                <span>${item.quantity}</span>
                                <button data-id="${id}" data-action="incr">+</button>
                            </div>
                        </div>
                        <span class="item-total">R$ ${st.toFixed(2)}</span>
                    </div>
                `;
            });

            cartItemsContainer.innerHTML = html;
            const total = subtotal + freteAtual;
            updateTotal(total);

            document.querySelectorAll('.cart-item .item-qty button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const action = btn.dataset.action;
                    if (action === 'incr') {
                        const item = cart[id];
                        if (item) addToCart({ id: item.id, name: item.name, price: item.price });
                    } else if (action === 'decr') {
                        removeFromCart(id);
                    }
                });
            });

            updateTroco();
            if (cartModal.classList.contains('active')) syncModalContent();
        }

        function updateTotal(total) {
            cartTotalValue.textContent = `R$ ${total.toFixed(2)}`;
            updateTroco();
            if (cartModal.classList.contains('active')) {
                modalCartTotal.textContent = `R$ ${total.toFixed(2)}`;
            }
        }

        function addToCart(item) {
            if (cart[item.id]) {
                cart[item.id].quantity += 1;
            } else {
                cart[item.id] = { ...item, quantity: 1 };
            }
            renderCart();
        }

        function removeFromCart(id) {
            if (cart[id]) {
                cart[id].quantity -= 1;
                if (cart[id].quantity <= 0) delete cart[id];
            }
            renderCart();
        }

        function clearCart() {
            cart = {};
            freteAtual = 0;
            bairroInput.value = '';
            freteResult.innerHTML = 'Digite seu bairro para calcular o frete.';
            valorPago.value = '';
            trocoResult.innerHTML = '';
            modalBairroInput.value = '';
            modalFreteResult.innerHTML = 'Digite seu bairro para calcular o frete.';
            modalValorPago.value = '';
            modalTrocoResult.innerHTML = '';
            renderCart();
            showToast('Carrinho limpo');
        }

        // ================================================================
        // 11. FRETE E TROCO
        // ================================================================
        function calcularFrete() {
            const bairro = bairroInput.value.trim().toLowerCase();
            if (!bairro) {
                freteResult.innerHTML = 'Digite o bairro.';
                freteAtual = 0;
                renderCart();
                return;
            }
            const found = Object.keys(fretes).find(key => bairro.includes(key) || key.includes(bairro));
            if (found) {
                freteAtual = fretes[found];
                freteResult.innerHTML = `Frete para <strong>${found}</strong>: R$ ${freteAtual.toFixed(2)}`;
            } else {
                freteAtual = 0;
                freteResult.innerHTML = 'Bairro não encontrado. Consulte-nos.';
            }
            renderCart();
        }

        function calcularFreteModal() {
            const bairro = modalBairroInput.value.trim().toLowerCase();
            if (!bairro) {
                modalFreteResult.innerHTML = 'Digite o bairro.';
                freteAtual = 0;
                renderCart();
                return;
            }
            const found = Object.keys(fretes).find(key => bairro.includes(key) || key.includes(bairro));
            if (found) {
                freteAtual = fretes[found];
                modalFreteResult.innerHTML = `Frete para <strong>${found}</strong>: R$ ${freteAtual.toFixed(2)}`;
                // Sincroniza com a sidebar
                bairroInput.value = modalBairroInput.value;
                freteResult.innerHTML = modalFreteResult.innerHTML;
            } else {
                freteAtual = 0;
                modalFreteResult.innerHTML = 'Bairro não encontrado. Consulte-nos.';
            }
            renderCart();
        }

        function updateTroco() {
            const totalText = cartTotalValue.textContent.replace('R$ ', '').replace(',', '.');
            const total = parseFloat(totalText) || 0;
            const pago = parseFloat(valorPago.value.replace(',', '.')) || 0;
            const payment = document.querySelector('input[name="payment"]:checked')?.value;
            if (payment === 'dinheiro' && pago > 0) {
                const troco = pago - total;
                if (troco >= 0) {
                    trocoResult.innerHTML = `Troco: <strong>R$ ${troco.toFixed(2)}</strong>`;
                } else {
                    trocoResult.innerHTML = `Faltam <strong>R$ ${(-troco).toFixed(2)}</strong>`;
                }
            } else {
                trocoResult.innerHTML = '';
            }
            // Sincroniza com o modal
            if (cartModal.classList.contains('active')) {
                modalValorPago.value = valorPago.value;
                modalTrocoResult.innerHTML = trocoResult.innerHTML;
            }
        }

        function updateModalTroco() {
            const totalText = modalCartTotal.textContent.replace('R$ ', '').replace(',', '.');
            const total = parseFloat(totalText) || 0;
            const pago = parseFloat(modalValorPago.value.replace(',', '.')) || 0;
            const payment = document.querySelector('input[name="modalPayment"]:checked')?.value;
            if (payment === 'dinheiro' && pago > 0) {
                const troco = pago - total;
                if (troco >= 0) {
                    modalTrocoResult.innerHTML = `Troco: <strong>R$ ${troco.toFixed(2)}</strong>`;
                } else {
                    modalTrocoResult.innerHTML = `Faltam <strong>R$ ${(-troco).toFixed(2)}</strong>`;
                }
            } else {
                modalTrocoResult.innerHTML = '';
            }
            // Sincroniza com a sidebar
            valorPago.value = modalValorPago.value;
            trocoResult.innerHTML = modalTrocoResult.innerHTML;
        }

        // ================================================================
        // 12. FINALIZAR (WHATSAPP)
        // ================================================================
        function checkout() {
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                alert('Adicione alguns itens ao carrinho.');
                return;
            }

            let total = 0;
            let msg = '🍧 *PEDIDO - AÇAÍ DU BOM* 🍧\n\n';
            keys.forEach(id => {
                const item = cart[id];
                const st = item.price * item.quantity;
                total += st;
                msg += `*${item.name}* x${item.quantity} = R$ ${st.toFixed(2)}\n`;
            });

            if (freteAtual > 0) {
                total += freteAtual;
                msg += `\n*Frete:* R$ ${freteAtual.toFixed(2)}`;
            }

            const payment = document.querySelector('input[name="payment"]:checked')?.value || 'não informado';
            msg += `\n*Total com frete:* R$ ${total.toFixed(2)}`;
            msg += `\n*Pagamento:* ${payment}`;

            if (payment === 'dinheiro') {
                const pago = parseFloat(valorPago.value.replace(',', '.')) || 0;
                if (pago > 0) {
                    const troco = pago - total;
                    msg += `\n*Valor pago:* R$ ${pago.toFixed(2)}`;
                    msg += `\n*Troco:* R$ ${troco >= 0 ? troco.toFixed(2) : 'insuficiente'}`;
                }
            }

            msg += `\n\n_Entrega: ${bairroInput.value || 'não informado'}_`;

            const phone = '5521974419161';
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        // ================================================================
        // 13. TOAST
        // ================================================================
        let toastTimer = null;

        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        // ================================================================
        // 14. SINCronizar conteúdo do modal do carrinho
        // ================================================================
        function syncModalContent() {
            const keys = Object.keys(cart);
            const totalItems = keys.reduce((acc, id) => acc + cart[id].quantity, 0);
            modalCartCount.textContent = totalItems;

            if (keys.length === 0) {
                modalCartItems.innerHTML = `<div class="cart-empty"><i class="fas fa-ice-cream"></i>Nenhum item adicionado</div>`;
                modalCartTotal.textContent = 'R$ 0,00';
                return;
            }

            let html = '';
            let subtotal = 0;
            keys.forEach(id => {
                const item = cart[id];
                const st = item.price * item.quantity;
                subtotal += st;
                html += `
                    <div class="cart-item">
                        <div class="item-info">
                            <span class="item-name">${item.name}</span>
                            <div class="item-qty">
                                <button data-id="${id}" data-action="decr" class="modal-qty-btn">−</button>
                                <span>${item.quantity}</span>
                                <button data-id="${id}" data-action="incr" class="modal-qty-btn">+</button>
                            </div>
                        </div>
                        <span class="item-total">R$ ${st.toFixed(2)}</span>
                    </div>
                `;
            });
            modalCartItems.innerHTML = html;

            const total = subtotal + freteAtual;
            modalCartTotal.textContent = `R$ ${total.toFixed(2)}`;

            // Sincroniza campos
            modalBairroInput.value = bairroInput.value;
            modalFreteResult.innerHTML = freteResult.innerHTML;

            const paymentSelected = document.querySelector('input[name="payment"]:checked');
            if (paymentSelected) {
                document.querySelector(`input[name="modalPayment"][value="${paymentSelected.value}"]`).checked = true;
            }
            modalValorPago.value = valorPago.value;
            modalTrocoResult.innerHTML = trocoResult.innerHTML;

            // Eventos dos botões de quantidade no modal
            document.querySelectorAll('.modal-qty-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const action = btn.dataset.action;
                    if (action === 'incr') {
                        const item = cart[id];
                        if (item) addToCart({ id: item.id, name: item.name, price: item.price });
                    } else if (action === 'decr') {
                        removeFromCart(id);
                    }
                    syncModalContent();
                    renderCart();
                });
            });

            updateModalTroco();
        }

        // ================================================================
        // 15. EVENTOS
        // ================================================================
        checkoutBtn.addEventListener('click', checkout);
        clearBtn.addEventListener('click', clearCart);

        // Abrir/fechar modal do carrinho
        function openCartModal() {
            cartModal.classList.add('active');
            syncModalContent();
        }

        function closeCartModalFn() {
            cartModal.classList.remove('active');
        }

        floatCartBtn.addEventListener('click', openCartModal);
        closeCartModal.addEventListener('click', closeCartModalFn);
        cartModal.addEventListener('click', (e) => {
            if (e.target === cartModal) closeCartModalFn();
        });

        // Frete sidebar
        calcFreteBtn.addEventListener('click', calcularFrete);
        bairroInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') calcularFrete();
        });

        // Frete modal
        modalCalcFreteBtn.addEventListener('click', calcularFreteModal);
        modalBairroInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') calcularFreteModal();
        });

        // Sincronizar input bairro entre sidebar e modal
        bairroInput.addEventListener('input', () => {
            modalBairroInput.value = bairroInput.value;
        });
        modalBairroInput.addEventListener('input', () => {
            bairroInput.value = modalBairroInput.value;
        });

        // Pagamento sidebar
        paymentRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (radio.value === 'dinheiro') {
                    trocoArea.classList.add('show');
                } else {
                    trocoArea.classList.remove('show');
                    trocoResult.innerHTML = '';
                }
                // Sincroniza com modal
                const modalRadio = document.querySelector(`input[name="modalPayment"][value="${radio.value}"]`);
                if (modalRadio) modalRadio.checked = true;
                if (radio.value === 'dinheiro') {
                    modalTrocoArea.classList.add('show');
                } else {
                    modalTrocoArea.classList.remove('show');
                    modalTrocoResult.innerHTML = '';
                }
                updateTroco();
                updateModalTroco();
            });
        });
        valorPago.addEventListener('input', () => {
            updateTroco();
            modalValorPago.value = valorPago.value;
        });

        // Pagamento modal
        modalPaymentRadios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (radio.value === 'dinheiro') {
                    modalTrocoArea.classList.add('show');
                } else {
                    modalTrocoArea.classList.remove('show');
                    modalTrocoResult.innerHTML = '';
                }
                // Sincroniza sidebar
                const sidebarRadio = document.querySelector(`input[name="payment"][value="${radio.value}"]`);
                if (sidebarRadio) sidebarRadio.checked = true;
                if (radio.value === 'dinheiro') {
                    trocoArea.classList.add('show');
                } else {
                    trocoArea.classList.remove('show');
                    trocoResult.innerHTML = '';
                }
                updateTroco();
                updateModalTroco();
            });
        });
        modalValorPago.addEventListener('input', () => {
            updateModalTroco();
            valorPago.value = modalValorPago.value;
        });

        // Ações do modal do carrinho
        modalCheckoutBtn.addEventListener('click', () => {
            // Sincroniza campos antes de finalizar
            bairroInput.value = modalBairroInput.value;
            freteResult.innerHTML = modalFreteResult.innerHTML;
            const paymentSelected = document.querySelector('input[name="modalPayment"]:checked');
            if (paymentSelected) {
                document.querySelector(`input[name="payment"][value="${paymentSelected.value}"]`).checked = true;
            }
            valorPago.value = modalValorPago.value;
            trocoResult.innerHTML = modalTrocoResult.innerHTML;
            checkout();
        });

        modalClearBtn.addEventListener('click', () => {
            clearCart();
            syncModalContent();
        });

        // ================================================================
        // 16. INICIALIZAR
        // ================================================================
        renderMenu();
        renderCart();

        window.addEventListener('resize', () => {
            if (window.innerWidth <= 850) {
                const total = Object.keys(cart).reduce((acc, id) => acc + cart[id].quantity, 0);
                floatCartBtn.style.display = total > 0 ? 'flex' : 'none';
            } else {
                floatCartBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
